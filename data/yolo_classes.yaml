# Detection classes for the schematic parser. Three groups share one YOLO head
# but are consumed separately downstream:
#   - component coarse classes (index 0..13): become contest components
#   - text (index 14): text regions, cropped and sent to OCR
#   - pin_tip (index 15): pin endpoints, drive PinF1 and net building
# Do not reorder after a training run starts. Rare CVJsonStd categories collapse
# into `other` (contest does not compare text for `other`).
names:
  - ic
  - resistor
  - capacitor
  - inductor
  - diode
  - transistor
  - gnd
  - vcc
  - net_label
  - connector
  - crystal
  - switch
  - testpoint
  - other
  - text
  - pin_tip

# race type (赛题词表) -> coarse yolo component class
coarse_map:
  box: ic
  block: ic
  amp: ic
  amp_3pin: ic
  amp_5pin: ic
  opt: ic
  r: resistor
  c: capacitor
  l: inductor
  transfomer: inductor
  d: diode
  led: diode
  esd: diode
  mosfet: transistor
  mosfet_npn: transistor
  mosfet_pnp: transistor
  bjt: transistor
  bjt_npn: transistor
  bjt_pnp: transistor
  gnd: gnd
  v: vcc
  net_input: net_label
  net_output: net_label
  net_short: net_label
  net_bidirection: net_label
  crystal: crystal
  crystal_2pin: crystal
  crystal_3pin: crystal
  crystal_4pin: crystal
  switch: switch
  jumper: switch
  testpoint: testpoint
  pin: connector
  circle_header: connector
  dc: connector
  # everything else -> other

TEXT_CLASS: text
PIN_CLASS: pin_tip
