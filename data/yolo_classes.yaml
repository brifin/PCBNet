# Detection classes for the schematic parser. Three groups share one YOLO head
# but are consumed separately downstream:
#   - component coarse classes (index 0..13): become contest components
#   - text (index 14): text regions, cropped and sent to OCR
#   - pin_tip (index 15): pin endpoints, drive PinF1 and net building
# Do not reorder after a training run starts. Rare CVJsonStd categories collapse
# into `other` (contest does not compare text for `other`).
names:
  # - pin_tip
  # - wire_endpoint
  - opamp                  # 对应 amp / amp_3pin / amp_5pin
  - antenna                # 对应 ant
  - battery                # 对应 battery
  - bjt                    # 对应 bjt / bjt_npn / bjt_pnp
  - bnp           # 对应 block
  - ic                # 对应 box
  - buzzer                 # 对应 buzzer
  - capacitor              # 对应 c
  - circle_header        # 对应 circle_header
  - crystal_oscillator     # 对应 crystal / crystal_2pin / crystal_3pin / crystal_4pin
  - diode                  # 对应 d
  - dc_socket     # 对应 dc
  - esd_protection   # 对应 esd
  - ground                 # 对应 gnd
  - jumper_cap             # 对应 jumper
  - inductor               # 对应 l
  - led                    # 对应 led
  - m3_screw          # 对应 m3螺丝
  - mosfet                 # 对应 mosfet / mosfet_npn / mosfet_pnp
  - motor                  # 对应 motor
  - network_input     # 对应 net_input
  - network_output    # 对应 net_output
  - network_short     # 对应 net_short
  - network_bidirection # 对应 net_bidirection
  - optocoupler            # 对应 opt
  - other         # 对应 other
  - resistor               # 对应 r
  - tube_segment  # 对应 seg
  - switch                 # 对应 switch
  - testpoint             # 对应 testpoint
  - transformer            # 对应 transformer
  - power           # 对应 v

# race type (赛题词表) -> coarse yolo component class
coarse_map:
  amp: opamp
  amp_3pin: opamp
  amp_5pin: opamp
  ant: antenna
  battery: battery
  bjt: bjt
  bjt_npn: bjt 
  bjt_pnp: bjt
  block: dnp
  box: ic
  buzzer: buzzer
  c: capacitor
  circle_header: circle_header
  crystal: crystal_oscillator
  crystal_2pin: crystal_oscillator
  crystal_3pin: crystal_oscillator
  crystal_4pin: crystal_oscillator
  d: diode
  dc: dc_socket
  esd: esd_protection
  gnd: ground
  jumper: jumper_cap
  l: inductor
  led: led
  m3螺丝: m3_screw
  mosfet: mosfet
  mosfet_npn: mosfet
  mosfet_pnp: mosfet
  motor: motor
  net_input: network_input
  net_output: network_output
  net_short: network_short
  net_bidirection: network_bidirection
  opt: optocoupler
  other: other
  r: resistor
  seg: tube_segment
  switch: switch
  testpoint: testpoint
  transformer: transformer
  v: power
  # everything else -> other

TEXT_CLASS: text
PIN_CLASS: pin_tip
